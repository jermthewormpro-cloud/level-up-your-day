<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up Your Day - Sound Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <style>
        body {
          background: linear-gradient(135deg, #121212 0%, #1a1a1a 100%);
          color: #e0e0e0;
          font-family: 'Inter', sans-serif;
          text-align: center;
          padding: 20px;
          min-height: 100vh;
          margin: 0;
          transition: background 0.5s;
        }
        /* Level Up Flash Animation */
        .level-up-flash { background: #00ff9d !important; transition: 0.1s; }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        h1 { color: #00ff9d; text-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
          background-color: #1e1e1e;
          border-radius: 16px;
          padding: 25px;
          margin-bottom: 20px;
          border: 1px solid #333;
          box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .highlight-card { border: 1px solid #00ff9d; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .metric-label { font-size: 0.75rem; color: #888; text-transform: uppercase; }
        .metric-value { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: #00ff9d; font-weight: 700; }
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; width: 100%; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background-color: #00ff9d; color: #121212; font-family: 'Orbitron', sans-serif; text-transform: uppercase; font-size: 0.8rem; transition: 0.2s; }
        .nav-bar { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; }
        .nav-bar button { flex: 1; font-size: 0.65rem; padding: 10px 5px; }
        .progress-bar-bg { background: #333; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: width 0.5s ease; }
        .xp-bar { background: #a29bfe; }
        .hidden { display: none; }
        .small-text { font-size: 0.75rem; color: #888; }
    </style>
</head>
<body>

<audio id="levelup-sound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>

<div class="container">
  <h1><i class="fa-solid fa-gamepad"></i> Level Up</h1>

  <section id="auth-section">
    <div class="card">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="Email"><br><br>
      <input type="password" id="login-password" placeholder="Password"><br><br>
      <button onclick="loginUser()">Enter Game</button>
      <p class="small-text">No account? <span style="color:#00ff9d; cursor:pointer" onclick="registerUserPrompt()">Sign Up</span></p>
    </div>
  </section>

  <div id="app-content" class="hidden">
    <nav class="nav-bar">
      <button onclick="showSection('dashboard')">Dash</button>
      <button onclick="showSection('mission')">Mission</button>
      <button onclick="logout()" style="background:#ff4757; color:white;">Exit</button>
    </nav>

    <div id="dashboard-section">
      <div class="card">
        <h2 id="welcome-msg">Hello</h2>
        <div class="metrics-grid">
            <div><p class="metric-label">Level</p><p class="metric-value" id="user-level">1</p></div>
            <div><p class="metric-label">XP</p><p class="metric-value" id="user-xp">0</p></div>
        </div>
        <div style="margin-top:15px;">
            <p class="small-text" style="color:#a29bfe">Progress to Next Level</p>
            <div class="progress-bar-bg"><div id="xp-progress-bar" class="progress-bar-fill xp-bar"></div></div>
        </div>
      </div>
     
      <div class="card highlight-card">
        <h3>Log Playtime</h3>
        <div class="input-group">
            <input type="number" id="log-input" placeholder="Minutes">
            <button onclick="logTime()">Log</button>
        </div>
      </div>
    </div>

    <div id="mission-section" class="hidden">
      <div class="card highlight-card">
        <h2>Active Quest</h2>
        <p id="mission-challenge" style="background:#252525; padding:10px; border-radius:8px; border-left:4px solid #00ff9d; text-align:left;"></p>
        <p id="mission-tip" style="background:#252525; padding:10px; border-radius:8px; border-left:4px solid #ffc107; text-align:left;"></p>
        <button id="mission-btn" onclick="completeMission()" style="width:100%; background:#ffc107;">Complete (+50 XP)</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentEmail = "";
let userData = { username: "", password: "", xp: 0, history: [], questsCompleted: 0 };

const allChallenges = ["Do 10 pushups.", "Drink water.", "Stretch for 1 min.", "Clean your desk.", "Do 15 squats.", "Do 20 jumping jacks.", "Wipe your screen."];
const allTips = ["Blink often.", "Sit straight.", "Take a 5 min break.", "Stay hydrated.", "Rest your eyes.", "Check your posture."];

function showSection(id) {
  document.getElementById('dashboard-section').classList.add('hidden');
  document.getElementById('mission-section').classList.add('hidden');
  document.getElementById(id + '-section').classList.remove('hidden');
  if(id === 'mission') {
    document.getElementById("mission-challenge").innerText = "Challenge: " + allChallenges[Math.floor(Math.random()*allChallenges.length)];
    document.getElementById("mission-tip").innerText = "Tip: " + allTips[Math.floor(Math.random()*allTips.length)];
    document.getElementById("mission-btn").disabled = false;
    document.getElementById("mission-btn").innerText = "Complete (+50 XP)";
  }
}

function loginUser() {
  const e = document.getElementById("login-email").value;
  const p = document.getElementById("login-password").value;
  const saved = localStorage.getItem("user_" + e);
  if(saved) {
    const data = JSON.parse(saved);
    if(data.password === p) {
      currentEmail = e;
      userData = data;
      // Fix missing data
      if (isNaN(userData.xp) || userData.xp === undefined) userData.xp = 0;
     
      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("app-content").classList.remove("hidden");
      document.getElementById("welcome-msg").innerText = "Player: " + userData.username;
      updateMetrics();
    } else { alert("Wrong password"); }
  } else { alert("User not found"); }
}

function registerUserPrompt() {
  const e = prompt("Enter Email:");
  const u = prompt("Enter Username:");
  const p = prompt("Enter Password:");
  if(e && u && p) {
    const newData = { username: u, password: p, xp: 0, history: [], questsCompleted: 0 };
    localStorage.setItem("user_" + e, JSON.stringify(newData));
    alert("Registered!");
  }
}

function logTime() {
  const mins = parseInt(document.getElementById("log-input").value);
  if(!isNaN(mins)) {
    userData.history.push({ date: new Date().toLocaleDateString(), mins: mins });
    saveData();
    document.getElementById("log-input").value = "";
    alert("Time Logged!");
  }
}

function completeMission() {
  const oldLevel = Math.floor((userData.xp || 0) / 500) + 1;
  userData.xp = (userData.xp || 0) + 50;
  const newLevel = Math.floor(userData.xp / 500) + 1;
 
  saveData();
  updateMetrics();
 
  document.getElementById("mission-btn").disabled = true;
  document.getElementById("mission-btn").innerText = "Quest Finished!";

  // Trigger Sound & Flash if Level Up
  if (newLevel > oldLevel) {
    playLevelUpEffect();
  }
}

function playLevelUpEffect() {
  // Play Sound
  const sound = document.getElementById("levelup-sound");
  sound.currentTime = 0;
  sound.play();

  // Visual Flash
  document.body.classList.add("level-up-flash");
  setTimeout(() => {
    document.body.classList.remove("level-up-flash");
    alert("✨ LEVEL UP! You reached Level " + (Math.floor(userData.xp / 500) + 1) + " ✨");
  }, 200);
}

function updateMetrics() {
  const safeXP = isFinite(userData.xp) ? userData.xp : 0;
  const level = Math.floor(safeXP / 500) + 1;
  const xpInLevel = safeXP % 500;
 
  document.getElementById("user-xp").innerText = safeXP;
  document.getElementById("user-level").innerText = level;
  document.getElementById("xp-progress-bar").style.width = (xpInLevel / 500 * 100) + "%";
}

function saveData() { localStorage.setItem("user_" + currentEmail, JSON.stringify(userData)); }
function logout() { location.reload(); }
</script>
</body>
</html>
