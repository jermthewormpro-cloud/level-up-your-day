<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up Master - Complete Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <style>
        body { background: linear-gradient(135deg, #121212 0%, #1a1a1a 100%); color: #e0e0e0; font-family: 'Inter', sans-serif; text-align: center; padding: 20px; min-height: 100vh; margin: 0; transition: background 0.3s; }
        .level-up-flash { background: #00ff9d !important; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        h1 { color: #00ff9d; text-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background-color: #1e1e1e; border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .highlight-card { border: 1px solid #00ff9d; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .metric-label { font-size: 0.75rem; color: #888; text-transform: uppercase; }
        .metric-value { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: #00ff9d; font-weight: 700; }
        .progress-bar-bg { background: #333; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; transition: width 0.5s ease; background: #a29bfe; }
        .nav-bar { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; }
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background-color: #00ff9d; color: #121212; font-family: 'Orbitron', sans-serif; text-transform: uppercase; font-size: 0.7rem; }
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .badge { background: #252525; padding: 10px; border-radius: 10px; opacity: 0.3; filter: grayscale(1); border: 1px solid #444; }
        .unlocked { opacity: 1; filter: grayscale(0); border-color: #ffc107; }
        .hidden { display: none; }
    </style>
</head>
<body>

<audio id="lvl-snd" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

<div class="container">
  <h1>LEVEL UP</h1>

  <section id="auth-section">
    <div class="card">
      <input type="email" id="email" placeholder="Email" style="width:90%; padding:10px; margin-bottom:10px; background:#252525; color:white; border:1px solid #333;"><br>
      <input type="password" id="pass" placeholder="Password" style="width:90%; padding:10px; margin-bottom:10px; background:#252525; color:white; border:1px solid #333;"><br>
      <button onclick="login()" style="width:95%">Login / Register</button>
    </div>
  </section>

  <div id="app-content" class="hidden">
    <nav class="nav-bar">
      <button onclick="show('dash')">Dash</button>
      <button onclick="show('quest')">Quest</button>
      <button onclick="show('trophy')">Stats</button>
      <button onclick="location.reload()" style="background:#ff4757">Exit</button>
    </nav>

    <div id="dash-section">
      <div class="card">
        <div class="metrics-grid">
          <div><p class="metric-label">Level</p><p class="metric-value" id="ui-lvl">1</p></div>
          <div><p class="metric-label">XP</p><p class="metric-value" id="ui-xp">0</p></div>
        </div>
        <div class="progress-bar-bg"><div id="xp-bar" class="progress-bar-fill"></div></div>
      </div>
      <div class="card highlight-card">
        <h3>Log Playtime</h3>
        <input type="number" id="mins" placeholder="Minutes" style="width:70%; padding:10px; background:#252525; color:white; border:1px solid #333;">
        <button onclick="logT()">Log</button>
      </div>
    </div>

    <div id="quest-section" class="hidden">
      <div class="card highlight-card">
        <h3 id="q-task" style="text-align:left; color:#00ff9d;"></h3>
        <p id="q-tip" style="text-align:left; font-size:0.9rem; border-left:3px solid #ffc107; padding-left:10px;"></p>
        <button id="q-btn" onclick="done()" style="width:100%; background:#ffc107;">Finish Quest (+50 XP)</button>
      </div>
    </div>

    <div id="trophy-section" class="hidden">
      <div class="card">
        <h3>Achievements</h3>
        <div class="badge-grid" id="badge-box"></div>
      </div>
    </div>
  </div>
</div>

<script>
let user = { xp: 0, done: 0, ach: [] };
let emailKey = "";

const challenges = ["Do 10 pushups", "Drink water", "Stretch back", "Clean desk", "15 squats", "20 jumping jacks", "Wipe screen", "10 deep breaths", "Walk 2 mins", "Touch toes"];
const tips = ["Blink often", "Sit straight", "5 min break", "Stay hydrated", "Monitor at eye level", "Rest eyes", "No sugar snacks"];

function show(id) {
  ['dash','quest','trophy'].forEach(s => document.getElementById(s+'-section').classList.add('hidden'));
  document.getElementById(id+'-section').classList.remove('hidden');
  if(id === 'quest') rollQuest();
  if(id === 'trophy') renderAch();
}

function login() {
  emailKey = "u_" + document.getElementById('email').value;
  let saved = localStorage.getItem(emailKey);
  if(saved) user = JSON.parse(saved);
  // NaN Protection
  user.xp = Number(user.xp) || 0;
  user.done = Number(user.done) || 0;
  user.ach = user.ach || [];
 
  document.getElementById('auth-section').classList.add('hidden');
  document.getElementById('app-content').classList.remove('hidden');
  updateUI();
}

function logT() { alert("Time logged to history!"); }

function rollQuest() {
  document.getElementById('q-task').innerText = "Quest: " + challenges[Math.floor(Math.random()*challenges.length)];
  document.getElementById('q-tip').innerText = "Pro Tip: " + tips[Math.floor(Math.random()*tips.length)];
  document.getElementById('q-btn').disabled = false;
  document.getElementById('q-btn').innerText = "Finish Quest (+50 XP)";
}

function done() {
  let oldL = Math.floor(user.xp / 500) + 1;
  user.xp += 50;
  user.done += 1;
  let newL = Math.floor(user.xp / 500) + 1;

  if(newL > oldL) {
    document.getElementById('lvl-snd').play();
    document.body.classList.add('level-up-flash');
    setTimeout(()=> document.body.classList.remove('level-up-flash'), 200);
  }
 
  checkAch();
  save();
  updateUI();
  document.getElementById('q-btn').disabled = true;
  document.getElementById('q-btn').innerText = "Quest Completed!";
}

function updateUI() {
  document.getElementById('ui-xp').innerText = user.xp;
  document.getElementById('ui-lvl').innerText = Math.floor(user.xp / 500) + 1;
  document.getElementById('xp-bar').style.width = (user.xp % 500 / 500 * 100) + "%";
}

function checkAch() {
  if(user.done >= 1 && !user.ach.includes('a1')) { user.ach.push('a1'); alert("Unlocked: First Quest!"); }
  if(user.xp >= 1000 && !user.ach.includes('a2')) { user.ach.push('a2'); alert("Unlocked: Veteran!"); }
}

function renderAch() {
  const box = document.getElementById('badge-box');
  const list = [{id:'a1', n:'Rookie', i:'fa-star'}, {id:'a2', n:'Elite', i:'fa-trophy'}];
  box.innerHTML = list.map(a => `
    <div class="badge ${user.ach.includes(a.id)?'unlocked':''}">
      <i class="fa-solid ${a.i}" style="font-size:1.5rem; color:#ffc107"></i><br>
      <span style="font-size:0.7rem">${a.n}</span>
    </div>
  `).join('');
}

function save() { localStorage.setItem(emailKey, JSON.stringify(user)); }
</script>
</body>
</html>
