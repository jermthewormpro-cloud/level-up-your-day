<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up - Streak Edition</title>
   
    <link rel="icon" href="https://img.icons8.com/fluency/96/000000/game-controller.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/96/000000/game-controller.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <style>
        :root { --neon: #00ff9d; --purple: #a29bfe; --bg: #121212; --card-bg: #1e1e1e; }
        body { background: linear-gradient(135deg, var(--bg) 0%, #1a1a1a 100%); color: #e0e0e0; font-family: 'Inter', sans-serif; text-align: center; padding: 20px; min-height: 100vh; margin: 0; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        h1 { color: var(--neon); text-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }
        .container { max-width: 500px; margin: 0 auto; }

        /* CARDS */
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .highlight-card { border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0, 255, 157, 0.1); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .metric-value { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: var(--neon); font-weight: 700; }
        .streak-active { color: #ff4757 !important; text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }

        /* NAVIGATION */
        .nav-bar { display: flex; gap: 5px; margin-bottom: 25px; justify-content: center; }
        .nav-bar button { flex: 1; font-size: 0.7rem; padding: 12px 5px; background: #252525; color: white; border: 1px solid #444; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .nav-bar button.active { background: var(--neon); color: black; border-color: var(--neon); font-weight: bold; }

        /* CALENDAR */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-day { width: 100%; aspect-ratio: 1; border-radius: 4px; background: #333; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; }
        .cal-day.active { background: var(--neon); color: black; box-shadow: 0 0 5px var(--neon); }

        /* BUTTONS & INPUTS */
        button { padding: 12px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background-color: var(--neon); color: #121212; transition: 0.3s; font-family: 'Orbitron', sans-serif; text-transform: uppercase; font-size: 0.75rem; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .share-btn { background: var(--purple); width: 100%; margin-top: 10px; }

        .hidden { display: none; }
    </style>
</head>
<body>

<audio id="action-snd" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>

<div class="container">
  <header><h1><i class="fa-solid fa-gamepad"></i> Level Up</h1></header>

  <section id="auth-section">
    <div class="card">
      <h2>Player Login</h2>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="loginUser()" style="width: 100%;">Enter Game</button>
      <p style="font-size: 0.7rem; margin-top: 15px;">New? <span style="color:var(--neon); cursor:pointer;" onclick="registerUser()">Register Account</span></p>
    </div>
  </section>

  <div id="app-content" class="hidden">
    <nav class="nav-bar">
      <button onclick="showSection('dashboard')" id="btn-dashboard" class="active">Dash</button>
      <button onclick="showSection('mission')" id="btn-mission">Quest</button>
